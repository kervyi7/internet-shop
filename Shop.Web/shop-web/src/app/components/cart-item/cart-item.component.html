<div
  *ngIf="isMobile; else desktop"
  class="cart-item flex align-items-center justify-content-between border-b py-3 w-full"
>
  <div class="flex align-items-center gap-3">
    <div class="flex align-items-center gap-1 flex-column">
      <p-checkbox
        *ngIf="isCart"
        [binary]="true"
        [ngModel]="item.isSelected"
        (ngModelChange)="onSelectChange($event.checked)"
      >
      </p-checkbox>

      <button
        *ngIf="isCart"
        pButton
        icon="pi pi-trash"
        class="p-button-text p-0 w-full"
        (click)="onRemove()"
      ></button>
    </div>

    <div class="flex gap-3 w-full">
      <div class="relative">
        <img
          [src]="item.product.images[0].smallBody"
          alt="{{ item.product.name }}"
          width="80"
          height="80"
          class="border-round-sm"
        />
        <span *ngIf="!isCart" class="absolute count">
          {{ item.quantity }}
        </span>
      </div>

      <div
        class="flex gap-1 flex-column w-11rem md:w-12rem justify-content-between"
      >
        <div class="overflow-hidden text-overflow-ellipsis white-space-nowrap">
          {{ item.product.name }}
        </div>

        <div class="w-9rem text-xs">
          {{
            (item.product.discountedPrice || item.product.price) * item.quantity
          }}
          USD
        </div>

        <div *ngIf="isCart">
          <input
            pInputText
            [ngModel]="item.quantity"
            [step]="1"
            [max]="item.product.count"
            [min]="1"
            (ngModelChange)="onQuantityChange($event)"
            [size]="1"
            class="p-1 lg:p-2 text-center"
          />
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #desktop>
  <div
    *ngIf="!isMobile; else desktop"
    class="cart-item flex align-items-center justify-content-between border-b py-3 w-full"
  >
    <div class="flex align-items-center gap-3">
      <div class="flex align-items-center gap-3 flex-row">
        <p-checkbox
          *ngIf="isCart"
          [binary]="true"
          [ngModel]="item.isSelected"
          (ngModelChange)="onSelectChange($event.checked)"
        >
        </p-checkbox>

        <button
          *ngIf="isCart"
          pButton
          icon="pi pi-trash"
          class="p-button-text p-2"
          (click)="onRemove()"
        ></button>
      </div>

      <div class="relative">
        <img
          [src]="item.product.images[0].smallBody"
          alt="{{ item.product.name }}"
          width="60"
          class="border-round-sm"
        />
        <span *ngIf="!isCart" class="absolute count">
          {{ item.quantity }}
        </span>
      </div>

      <div>
        <div class="font-semibold">{{ item.product.name }}</div>
      </div>
    </div>

    <div class="flex align-items-center gap-4">
      <div *ngIf="isCart">
        <input
          pInputText
          type="number"
          [ngModel]="item.quantity"
          [step]="1"
          [max]="item.product.count"
          [min]="1"
          (ngModelChange)="onQuantityChange($event)"
          [size]="1"
          class="p-1 lg:p-2 text-center cart-count"
        />
      </div>

      <div class="text-lg w-9rem text-right">
        {{
          (item.product.discountedPrice || item.product.price) * item.quantity
        }}
        USD
      </div>
    </div>
  </div>
</ng-template>
