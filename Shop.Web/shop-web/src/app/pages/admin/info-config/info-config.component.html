<div class="w-full p-3 mx-auto">
  <p-accordion *ngIf="!editMode">
    <p-accordionTab header="Contact Information">
      <form [formGroup]="contactForm" class="p-fluid">
        <div class="grid">
          <div class="col-12 md:col-6">
            <label>Email</label>
            <input pInputText formControlName="email" />
          </div>

          <div class="col-12 md:col-6">
            <label>Phone</label>
            <input pInputText formControlName="phone" />
          </div>

          <div class="col-12">
            <label>Address</label>
            <input pInputText formControlName="address" />
          </div>
        </div>

        <h3 class="mt-4">Social Networks</h3>

        <div class="grid">
          <div
            class="col-12 md:col-4"
            *ngFor="
              let field of [
                'instagram',
                'facebook',
                'twitter',
                'telegram',
                'linkedin',
                'youtube',
                'discord',
                'github',
                'reddit',
                'twitch'
              ]
            "
          >
            <label class="capitalize">{{ field }}</label>
            <input
              pInputText
              [formControlName]="field"
              placeholder="Link to {{ field }}"
            />
          </div>
        </div>

        <div class="flex justify-content-end mt-3">
          <button
            pButton
            type="button"
            label="Save"
            icon="pi pi-check"
            (click)="saveContacts()"
            [disabled]="contactForm.invalid"
          ></button>
        </div>
      </form>
    </p-accordionTab>
    <p-accordionTab header="Banners">
      <shop-banners></shop-banners>
    </p-accordionTab>
    <p-accordionTab *ngFor="let page of pages" [selected]="false">
      <ng-template pTemplate="header">
        <div class="flex align-items-center w-full">
          <p-button
            icon="pi pi-pencil"
            size="small"
            (click)="edit(page); $event.stopPropagation()"
          ></p-button>
          <span class="ml-3">{{ page.header }}</span>
        </div>
      </ng-template>

      <div class="p-3 border-round surface-50">
        <div [innerHTML]="page.htmlContent"></div>
      </div>
    </p-accordionTab>
  </p-accordion>

  <div *ngIf="editMode && selectedPage">
    <h2 class="text-xl font-semibold mb-2">Edit: {{ selectedPage.header }}</h2>

    <p-editor
      #editorRef
      [style]="{ height: '320px' }"
      (onInit)="onEditorInit($event)"
    >
      <ng-template pTemplate="header">
        <span class="ql-formats">
          <button type="button" class="ql-bold" aria-label="Bold"></button>
          <button type="button" class="ql-italic" aria-label="Italic"></button>
          <button
            type="button"
            class="ql-underline"
            aria-label="Underline"
          ></button>
          <button type="button" class="ql-strike" aria-label="Strike"></button>
        </span>

        <span class="ql-formats">
          <button
            type="button"
            class="ql-header"
            value="1"
            aria-label="Header 1"
          ></button>
          <button
            type="button"
            class="ql-header"
            value="2"
            aria-label="Header 2"
          ></button>
        </span>

        <span class="ql-formats">
          <button
            type="button"
            class="ql-list"
            value="ordered"
            aria-label="Ordered List"
          ></button>
          <button
            type="button"
            class="ql-list"
            value="bullet"
            aria-label="Bullet List"
          ></button>
        </span>

        <span class="ql-formats">
          <button
            type="button"
            class="ql-script"
            value="sub"
            aria-label="Subscript"
          ></button>
          <button
            type="button"
            class="ql-script"
            value="super"
            aria-label="Superscript"
          ></button>
        </span>

        <span class="ql-formats">
          <button
            type="button"
            class="ql-indent"
            value="-1"
            aria-label="Decrease Indent"
          ></button>
          <button
            type="button"
            class="ql-indent"
            value="+1"
            aria-label="Increase Indent"
          ></button>
        </span>

        <span class="ql-formats">
          <select class="ql-size">
            <option value="small"></option>
            <option selected></option>
            <option value="large"></option>
            <option value="huge"></option>
          </select>
        </span>

        <span class="ql-formats">
          <select class="ql-color"></select>
          <select class="ql-background"></select>
        </span>

        <span class="ql-formats">
          <select class="ql-align"></select>
        </span>

        <span class="ql-formats">
          <button
            type="button"
            class="ql-blockquote"
            aria-label="Blockquote"
          ></button>
          <button
            type="button"
            class="ql-code-block"
            aria-label="Code Block"
          ></button>
        </span>

        <span class="ql-formats">
          <button
            type="button"
            class="ql-clean"
            aria-label="Remove Formatting"
          ></button>
        </span>
      </ng-template>
    </p-editor>

    <div class="mt-3 flex gap-2">
      <p-button label="Save" (click)="savePage()"></p-button>
      <p-button label="Cancel" (click)="cancelEditPage()"></p-button>
    </div>
  </div>
</div>
