<button
  pButton
  label="Add new shipping method"
  icon="pi pi-plus"
  (click)="showAddForm()"
  class="mt-3"
></button>

<div class="flex gap-4 pt-4 flex-wrap w-full">
  <ng-container *ngFor="let option of shippingOptions">
    <div
      class="p-card p-4 flex flex-column align-items-start w-18rem border-round-xl shadow-2"
    >
      <div class="flex justify-content-between w-full align-items-center mb-2">
        <h3 class="m-0">{{ option.name }}</h3>
        <span
          class="text-sm"
          [ngClass]="{
            'text-green-600': option.isActive,
            'text-red-500': !option.isActive
          }"
        >
          {{ option.isActive ? "Active" : "Inactive" }}
        </span>
      </div>
      <p class="m-0 text-sm">Cost: {{ option.cost | currency : "USD" }}</p>
      <p class="m-0 text-xs mt-1" *ngIf="option.description">
        {{ option.description }}
      </p>

      <div class="flex gap-2 mt-3">
        <button
          pButton
          icon="pi pi-pencil"
          class="p-button-sm p-button-text"
          (click)="showEditForm(option)"
        ></button>
        <button
          pButton
          icon="pi pi-trash"
          class="p-button-sm p-button-text p-button-danger"
          (click)="delete(option)"
        ></button>
      </div>
    </div>
  </ng-container>
</div>

<p-dialog
  [(visible)]="formVisible"
  [header]="isEdit ? 'Edit Shipping Method' : 'Add Shipping Method'"
  [modal]="true"
  [style]="{ width: '500px' }"
>
  <form [formGroup]="shippingForm" (ngSubmit)="save()" class="p-fluid">
    <div class="flex flex-column gap-4 w-full">
      <div class="flex flex-column gap-2">
        <label for="name">Name*</label>
        <input
          pInputText
          id="name"
          formControlName="name"
          placeholder="Method name"
        />
        <small class="p-error" *ngIf="getError('name')">{{
          getError("name")
        }}</small>
      </div>

      <div class="flex flex-column gap-2">
        <label for="cost">Cost*</label>
        <input
          type="number"
          pInputText
          id="cost"
          formControlName="cost"
          placeholder="Delivery cost"
        />
        <small class="p-error" *ngIf="getError('cost')">{{
          getError("cost")
        }}</small>
      </div>

      <div class="flex flex-column gap-2">
        <label for="description">Description</label>
        <textarea
          pInputTextarea
          id="description"
          formControlName="description"
          placeholder="Optional details"
          rows="3"
        ></textarea>
      </div>

      <div class="flex align-items-center gap-2">
        <p-checkbox
          formControlName="isActive"
          inputId="isActive"
          [binary]="true"
        ></p-checkbox>
        <label for="isActive">Active</label>
      </div>

      <div class="flex gap-2 justify-content-end">
        <button
          pButton
          type="submit"
          label="Save"
          icon="pi pi-check"
          [disabled]="shippingForm.invalid"
        ></button>
        <button
          pButton
          type="button"
          label="Cancel"
          icon="pi pi-times"
          (click)="formVisible = false"
        ></button>
      </div>
    </div>
  </form>
</p-dialog>
