<shop-discounted-widget></shop-discounted-widget>
<ng-container *ngIf="(categoriesState$ | async)?.data as data">
  <div class="flex categories-container gap-3" *ngIf="data.length > 0">
    <div
      class="category-wrapper"
      *ngFor="let category of data"
      (click)="goToProductList(category.name)"
    >
      <img [src]="category.image.smallBody" />
      <p>{{ category.name }}</p>
    </div>
  </div>
</ng-container>
