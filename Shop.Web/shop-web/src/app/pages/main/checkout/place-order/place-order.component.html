<div class="flex flex-column lg:flex-row gap-6 pb-3">
  <div class="w-full lg:w-2/3">
    <h2 class="mb-4">Order</h2>

    <shop-cart-item
      *ngFor="let product of cart"
      [item]="product"
      [isCart]="false"
    ></shop-cart-item>

    <h3 class="mt-6 mb-2">Shipping service</h3>
    <div class="flex justify-content-between mb-6">
      <span>Post Service 1</span>
      <span class="font-semibold">{{ shippingCost }} USD</span>
    </div>

    <form
      [formGroup]="checkoutForm"
      (ngSubmit)="submitOrder()"
      class="flex flex-column gap-4"
    >
      <div class="flex flex-column lg:flex-row gap-4">
        <input pInputText placeholder="First name*" formControlName="firstName" class="w-full lg:w-1/2" />
        <input pInputText placeholder="Last name*" formControlName="lastName" class="w-full lg:w-1/2" />
      </div>

      <div class="flex flex-column lg:flex-row gap-4">
        <input pInputText placeholder="Country / Region*" formControlName="country" class="w-full lg:w-1/2" />
        <input pInputText placeholder="Town / City*" formControlName="city" class="w-full lg:w-1/2" />
      </div>

      <div class="flex flex-column lg:flex-row gap-4">
        <input pInputText placeholder="Street*" formControlName="street" class="w-full lg:w-1/2" />
        <input pInputText placeholder="House number*" formControlName="houseNumber" class="w-full lg:w-1/2" />
      </div>

      <div class="flex flex-column lg:flex-row gap-4">
        <input pInputText placeholder="Apartment" formControlName="apartment" class="w-full lg:w-1/2" />
        <input pInputText placeholder="Postcode / ZIP*" formControlName="postcode" class="w-full lg:w-1/2" />
      </div>

      <div class="flex flex-column lg:flex-row gap-4">
        <input pInputText placeholder="Phone*" formControlName="phone" class="w-full lg:w-1/2" />
        <input pInputText placeholder="Email address*" type="email" formControlName="email" class="w-full lg:w-1/2" />
      </div>

      <textarea
        pInputTextarea
        rows="4"
        class="w-full"
        placeholder="Order notes"
        formControlName="notes"
        maxlength="200"
      ></textarea>

      <p-checkbox
        [binary]="true"
        formControlName="agreement"
        label="I agree to the website terms and conditions"
      ></p-checkbox>
    </form>
  </div>

  <div class="w-full mx-auto lg:w-1/3">
    <shop-order-summary
      [itemsAmount]="total"
      [shippingAmount]="shippingCost"
      [isCart]="false"
      (payClicked)="submitOrder()"
    ></shop-order-summary>
  </div>
</div>
