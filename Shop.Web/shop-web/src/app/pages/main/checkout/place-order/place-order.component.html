<div class="flex flex-column lg:flex-row gap-6 pb-3 mx-auto w-11 lg:w-9">
  <div class="w-full lg:w-2/3">
    <h2 class="mb-4">Order</h2>

    <shop-cart-item
      *ngFor="let product of cart"
      [item]="product"
      [isCart]="false"
    ></shop-cart-item>

    <h3 class="mt-6 mb-2">Shipping service</h3>

    <div>
      <div class="flex flex-column gap-3 mb-6">
        <div
          *ngFor="let option of shippingOptions"
          class="flex justify-content-between align-items-center p-3 border-round cursor-pointer border-1 surface-card"
          [class.border-primary]="option.id === selectedShippingOption?.id"
          (click)="selectShipping(option)"
        >
          <div class="flex align-items-center gap-3 w-full">
            <p-radioButton
              name="shippingOption"
              [value]="option"
              [inputId]="'option' + option.id"
              [(ngModel)]="selectedShippingOption"
              (onClick)="selectShipping(option)"
            ></p-radioButton>

            <label
              [for]="'option' + option.id"
              class="flex flex-column cursor-pointer w-full"
            >
              <span class="font-semibold">{{ option.name }}</span>
              <small class="text-color-secondary">{{
                option.description
              }}</small>
            </label>
          </div>

          <div class="font-semibold white-space-nowrap">
            {{ option.cost | currency : "USD" }}
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="deliveryAddresses?.length > 0; else form">
      <h3 class="mb-4">Select delivery address</h3>
      <p-button (onClick)="addAddress()" label="Add new one"></p-button>
      <div class="overflow-x-auto p-1">
        <div class="flex mt-4 gap-4 justify-content-center w-max">
          <ng-container *ngFor="let address of deliveryAddresses">
            <shop-address-card
              [address]="address"
              [isEdit]="false"
              [selectedAddressId]="selectedAddress?.id"
              (select)="selectDeliveryAddress($event)"
            ></shop-address-card>
          </ng-container>
        </div>
      </div>
    </div>

    <div class="mt-5" [formGroup]="extraForm">
      <h3 class="mb-3">Order notes</h3>
      <div>
        <textarea
          pInputTextarea
          rows="4"
          class="w-full"
          placeholder="Order notes"
          formControlName="notes"
          maxlength="200"
        ></textarea>
        <div class="error" *ngIf="getErrorMessage('notes', extraForm) as error">
          {{ error }}
        </div>
      </div>

      <div class="mt-3">
        <p-checkbox
          [binary]="true"
          label="I agree to the website terms and conditions"
          formControlName="agreement"
        ></p-checkbox>
        <div
          class="error"
          *ngIf="getErrorMessage('agreement', extraForm) as error"
        >
          {{ error }}
        </div>
      </div>
    </div>

    <ng-template #form>
      <h3 class="mb-4">Fill out the form</h3>
      <form
        [formGroup]="checkoutForm"
        (ngSubmit)="submitOrder()"
        class="flex flex-column gap-4"
      >
        <div class="flex flex-column lg:flex-row gap-4">
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="First name*"
              formControlName="firstName"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('firstName', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="Last name*"
              formControlName="lastName"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('lastName', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
        </div>

        <div class="flex flex-column lg:flex-row gap-4">
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="Country / Region*"
              formControlName="country"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('country', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="Town / City*"
              formControlName="city"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('city', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
        </div>
        <div class="flex flex-column lg:flex-row gap-4">
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="Street*"
              formControlName="street"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('street', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="House number*"
              formControlName="houseNumber"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('houseNumber', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
        </div>

        <div class="flex flex-column lg:flex-row gap-4">
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="Apartment"
              formControlName="apartment"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('apartment', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="Postcode / ZIP*"
              formControlName="postcode"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('postcode', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
        </div>

        <div class="flex flex-column lg:flex-row gap-4">
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="Phone*"
              formControlName="phone"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('phone', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
          <div class="w-full lg:w-1/2">
            <input
              pInputText
              placeholder="Email address*"
              type="email"
              formControlName="email"
              class="w-full"
            />
            <div
              class="error"
              *ngIf="getErrorMessage('email', checkoutForm) as error"
            >
              {{ error }}
            </div>
          </div>
        </div>
        <div>
          <textarea
            pInputTextarea
            rows="4"
            class="w-full"
            placeholder="Shipping notes"
            formControlName="notes"
            maxlength="200"
          ></textarea>
          <div
            class="error"
            *ngIf="getErrorMessage('notes', checkoutForm) as error"
          >
            {{ error }}
          </div>
        </div>
      </form>
    </ng-template>
  </div>

  <div class="w-full mx-auto lg:w-1/3">
    <shop-order-summary
      [itemsAmount]="total"
      [shippingAmount]="shippingCost"
      [isDisabled]="!cart.length"
      [isCart]="false"
      (payClicked)="submitOrder()"
    ></shop-order-summary>
  </div>
</div>
