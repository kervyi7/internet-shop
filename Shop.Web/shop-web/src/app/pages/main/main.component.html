<header>
  <img class="logo" src="assets/img/logo.svg" (click)="goToHome()">
  <p-button [text]="true" class="button">
    <span class="material-icons-outline" (click)="openCart()">shopping_cart</span>
    <span *ngIf="totalQuantity$ | async as quantity" class="cart-quantity">
      {{ quantity }}
    </span>
  </p-button>
  <p-button [text]="true" class="button" *ngIf="isAuthorized; else loginButton" (click)="redirect()">
    <span class="material-icons-outline">account_circle</span>
  </p-button>
  <ng-template #loginButton>
    <p-button [text]="true" (click)="goToLogin()">Sign In</p-button>
  </ng-template>
</header>
<main>
  <router-outlet></router-outlet>
</main>
<footer>
  <div class="logo">
    <img src="assets/img/logo.svg" (click)="goToHome()">
  </div>
  <!-- add config file -->
  <div class="contacts">
    <h1>Contacts</h1>
    <span>+380888888888</span>
    <span>mail&commat;gmail.com</span>
  </div>
  <div class="social-networks">
    <img src="assets/img/social-networks/instagram.svg">
    <img src="assets/img/social-networks/facebook.svg">
    <img src="assets/img/social-networks/x.svg">
    <img src="assets/img/social-networks/youtube.svg">
  </div>
</footer>
